# Секция предметов.
items:
  diamond: # Название/айди предмета. Используется в слушателе [DROP_ITEM] <айди>
    # Материал предмета.
    material: diamond
    # Название предмета.
    name: "<green>Алмаз"
    # Количество предмета.
    amount: 1
    # Лор предмета.
    lore:
      - '<gray>Выпал с Алмазного блока'
    # Зачарования предмета.
    # "ID-ЗАЧАРА УРОВЕНЬ"
    enchants: []
    # Флаги предмета.
    flags:
      - 'HIDE_ENCHANTS'
    # Custom Model Data предмета.
    custom_model_data: 0
  emerald:
    material: emerald
    name: "<green>Изумруд"
    lore:
      - '<gray>Выпал с Изумрудного блока'