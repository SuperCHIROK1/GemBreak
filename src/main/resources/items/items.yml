# Список доступных GLOW цветов:
## white - Белый
## gray - Серый
## dark_gray - Тёмно-серый
## black - Чёрный
## red - Красный
## dark_red - Тёмно-красный
## gold - Золотой (Оранжевый)
## yellow - Жёлтый
## green - Светло-зелёный
## dark_green - Тёмно-зелёный
## aqua - Голубой
## dark_aqua - Бирюзовый
## blue - Синий
## dark_blue - Тёмно-синий
## light_purple - Розовый (Светло-фиолетовый)
## dark_purple - Фиолетовый
## none - Подсветка отсутствует

# Секция предметов.
items:
  diamond: # Название/айди предмета. Используется в слушателе [DROP_ITEM] <айди>
    # Материал предмета.
    material: diamond
    # Название предмета.
    name: "<green>Алмаз"
    # Количество предмета.
    amount: 1
    # Лор предмета.
    lore:
      - '<gray>Выпал с Алмазного блока'
    # Зачарования предмета.
    # "ID-ЗАЧАРА УРОВЕНЬ"
    enchants: []
    # Флаги предмета.
    flags:
      - 'HIDE_ENCHANTS'
    # Custom Model Data предмета.
    custom_model_data: 0
    # Будет предмет не разрушаемым?
    unbreakable: false
    # Настройка иных параметров дропа.
    drop_params:
      # Какого цвета будет подсветка.
      # Если хотите, чтобы этой подсветки не было, оставьте 'none'.
      glow: none
      # Голограмма над предметом.
      # Оставьте пустым, если хотите, чтобы этой голограммы не было.
      display_name: ''
  emerald:
    material: emerald
    name: "<green>Изумруд"
    lore:
      - '<gray>Выпал с Изумрудного блока'
    drop_params:
      glow: green
      display_name: '<green>Изумруд'
  sun_flower:
    material: dandelion